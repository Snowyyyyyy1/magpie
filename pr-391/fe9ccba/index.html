<main><h1>#391 界面预览</h1><p class="m">commit fe9ccba · <a href="https://github.com/yetone/magpie/pull/391">回到 PR</a> · 这个 diff 给浏览器里的 magpie（body.web）补了一整套窄屏/触摸样式：顶栏标签换到单独一行并可横向滚动、表单和列表行换行、触摸目标放大到 44px、用量统计改两列、图表日期标签自动隐藏重叠项、弹层宽度收在视口内、编辑器与资源库/路由块改成单列；同时让手指惯性滚动可以继续（停手后保护恢复），触摸设备上打开模型浮层时不再自动弹键盘，并给页面视口加上安全区（viewport-fit=cover）。</p>
